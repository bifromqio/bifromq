name: Cov-Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  license:
    name: "License Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Check License Header
        uses: apache/skywalking-eyes/header@6e368ec14f31521edc7118374773e78d2d646aeb
      - name: Install without tests
        run: ./mvnw -q -DskipTests install
      - name: Check Dependencies' License
        uses: apache/skywalking-eyes/dependency@6e368ec14f31521edc7118374773e78d2d646aeb
        env:
          MAVEN_OPTS: -Xmx1g
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: "BifroMQ Code Coverage Test"
    needs: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install TestSuites
        run: mvn install -pl testsuites -am
      - name: Build with Maven
        run: mvn clean verify -P build-coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
          if-no-files-found: warn
